# Configuração do Sistema de Coleta de Dataset Visual Servoing (DENSO VS-050 + Cam-App)

dry_run: false  # Defina como false quando estiver conectado ao robô e smartphone reais

robot:
  ip_address: "192.168.160.227"
  workspace_name: "VS_WORKSPACE"
  control_name: "DENSO_VS050"
  speed: 20.0                  # Velocidade do braço (0 a 100%)
  accel: 20.0                  # Aceleração (0 a 100%)
  decel: 20.0                  # Desaceleração (0 a 100%)
  stabilization_delay_sec: 1.5 # Tempo de amortecimento/espera mecânica antes da foto

  tcp_offset:                  # Deslocamento do Tool Center Point (TCP) da ferramenta/suporte
    x: 0.0                     # em mm
    y: 0.0                     # em mm
    z: 0.0                     # em mm
    rx: 0.0                    # em graus
    ry: 0.0                    # em graus
    rz: 0.0                    # em graus
    tag: "SMARTPHONE_TOOL"

smartphone:
  # Endereço(s) IP do aplicativo Cam-App (HTTP / NanoHTTPD na porta 8080)
  ips:
    - "192.168.155.44"
  port: 8080
  stabilization_delay_sec: 1.0 # Tempo de acomodação física da lente (VCM) e ganhos do sensor após POST /config
  timeout_sec: 3.0
  max_retries: 4
  retry_backoff_sec: 0.5

  # Apenas duas configurações são utilizadas: "auto" e "manual_calibrado"
  active_presets:
    - "auto"
    - "manual_calibrado"

  # Quando true, na pose inicial P0 o sistema coloca a câmera em "auto", captura 1 frame
  # para ler lens_focus_distance, sensor_sensitivity (ISO) e sensor_exposure_time do X-Camera-Metadata
  # e aplica automaticamente esses valores em "manual_calibrado".
  auto_calibrate_manual: true

  presets:
    "auto":
      control_mode: "auto"
      focus_distance: 0.0
      iso: 100
      exposure_time_ns: 10000000
      ois_enabled: true
      eis_enabled: true

    "manual_calibrado":
      control_mode: "manual"
      auto_calibrate: true       # Se false, usa os valores fixos abaixo sem sobrescrever pelo modo auto
      focus_distance: 1.8621974  # Dioptrias (1 / distância_em_metros)
      iso: 1141
      exposure_time_ns: 16666660 # ~16.67 ms
      ois_enabled: false
      eis_enabled: false

  # Mapeamento de IPs para o nome da pasta da câmera
  camera_names:
    "192.168.155.44": "cam_01_moto_razr_60_ultra"
    "192.168.158.48": "cam_01_moto_edge_40"

variations:
  delta_trans_xy:              # Variação P1 (Translação XY)
    dx: 20.0                   # mm
    dy: 15.0                   # mm
  delta_rot_z: 15.0            # Variação P2 (Rotação Rz / J6 em graus)
  delta_scale_z: -30.0         # Variação P3 (Profundidade Z em mm)
  delta_combined:              # Variação P4 (Combinada)
    dx: 15.0                   # mm
    dy: 10.0                   # mm
    dz: -20.0                  # mm
    drz: 10.0                  # graus

scenes:
  - name: "scene_01"
    description: "Enquadramento do Cenário 01 - Visão Geral"
    camera_presets:
      - "auto"
      - "manual_calibrado"
    p0_pose:
      cartesian: [440.0, 60.0, 585.0, 16.0, -22.0, 150.0, 1]

  - name: "scene_02"
    description: "Enquadramento do Cenário 02 - Aproximação Fina"
    camera_presets:
      - "auto"
      - "manual_calibrado"
    p0_pose:
      cartesian: [440.0, 60.0, 585.0, 16.0, -22.0, 150.0, 1]

dataset:
  output_dir: "assets/dataset"
  save_raw_photos: true
